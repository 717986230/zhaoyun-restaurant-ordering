<!-- 子龙 · 游龙 — 赵云's brand crest. A single celadon 团龙 (coiled dragon),
     named for Zhao Yun's courtesy name 子龙, chasing the pearl inside a
     porcelain roundel. Ink-on-dark; holds to the menu's accent (#8fb0a3)
     and porcelain (#e9edee). Reuse as a brand mark, member crest, menu
     divider or receipt seal. -->
