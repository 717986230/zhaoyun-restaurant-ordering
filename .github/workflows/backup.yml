name: D1 backup

# Every night, the whole live database exported, checked by loading it, and
# kept encrypted as a workflow artifact for 90 days — beside D1's own Time
# Travel (point-in-time restore of the last days), not instead of it: this
# copy lives outside Cloudflare. docs/OPERATIONS.md says how to restore it.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export, check and keep D1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The export holds guests' e-mail addresses and the receipts: it is
      # never kept unencrypted, so without a passphrase nothing is kept.
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Say what is missing
        if: env.CLOUDFLARE_API_TOKEN == '' || env.BACKUP_PASSPHRASE == ''
        run: |
          echo "::warning::No backup was taken: set the CLOUDFLARE_API_TOKEN and BACKUP_PASSPHRASE repository secrets (docs/OPERATIONS.md)."

      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != '' && env.BACKUP_PASSPHRASE != ''

      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != '' && env.BACKUP_PASSPHRASE != ''
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != '' && env.BACKUP_PASSPHRASE != ''

      - name: Export the live database
        if: env.CLOUDFLARE_API_TOKEN != '' && env.BACKUP_PASSPHRASE != ''
        run: npx wrangler d1 export zhaoyun-ordering --remote --output backup.sql

      # Loaded into an empty SQLite database and checked before it is kept.
      - name: Check the export loads
        if: env.CLOUDFLARE_API_TOKEN != '' && env.BACKUP_PASSPHRASE != ''
        run: node --no-warnings scripts/verify-d1-export.mjs backup.sql

      - name: Encrypt it
        if: env.CLOUDFLARE_API_TOKEN != '' && env.BACKUP_PASSPHRASE != ''
        run: |
          name="zhaoyun-d1-$(date -u +%Y%m%dT%H%M%SZ).sql.gz.enc"
          gzip -9 -c backup.sql | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -out "$name"
          rm backup.sql
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        if: env.CLOUDFLARE_API_TOKEN != '' && env.BACKUP_PASSPHRASE != ''
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90
          if-no-files-found: error
