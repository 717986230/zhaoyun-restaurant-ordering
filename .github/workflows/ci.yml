name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # node:sqlite needs the version pinned in package.json engines.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (project references)
        run: npm run typecheck

      - name: Domain unit tests
        run: npm run unit

      - name: Fastify/SQLite integration tests
        run: npm run server:test

      - name: Web production build
        run: npm run build

      # Every Playwright project is a Chromium device profile.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Responsive end-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
