name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push to a pull request branch would otherwise run this twice, and the
# Android job is the expensive half.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Domain unit tests
        run: npm run unit

      - name: Server integration tests
        run: npm run server:test


      - name: Web build
        run: npm run build

      # The same contract suite the Node server just passed, run against the
      # Worker on a local D1 — workerd and the real D1 engine, so it needs no
      # Cloudflare credentials and runs on every pull request.
      - name: Worker contract on D1
        run: npm run worker:test

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive end-to-end tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The APK is the artefact the restaurant actually installs, so it is built
    # from the same commit the checks above ran on.
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Puts the SDK on PATH and accepts the licences the Gradle plugin checks
      # for. `packages` is set because the action still defaults to installing
      # `tools`, which Google removed from the repository — sdkmanager exits 1
      # on "Failed to find package 'tools'" and takes the job with it.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: npm ci

      # A tablet's `location.origin` inside the Capacitor shell is localhost, so
      # without this the installed APK can only reach a backend after someone
      # types its address into the admin console. Set the repository variable
      # API_BASE_URL to the deployment and the APK ships pointing at it; leave
      # it unset and nothing changes. A device configured by hand still wins.
      - name: Build web assets
        run: npm run build
        env:
          VITE_API_BASE: ${{ vars.API_BASE_URL }}

      - name: Sync Capacitor Android project
        run: npm run cap:sync

      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      # On a pull_request event GITHUB_SHA is the merge commit, which exists in
      # no branch — name the APK after the commit a person can actually check out.
      - name: Name the APK after the commit
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p dist/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/apk/zhaoyun-ordering-${COMMIT:0:7}-debug.apk"
          sha256sum dist/apk/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhaoyun-ordering-debug-apk
          path: dist/apk/*.apk
          retention-days: 30

      # Also attach it to a rolling prerelease. An Actions artifact is a zip
      # behind a login and is served from storage some networks cannot reach; a
      # release asset is the apk itself, on a stable link, and replaces the
      # previous one so the tag always means "the latest build of this branch".
      - name: Publish the APK as a rolling prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tag="apk-$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" dist/apk/*.apk \
            --prerelease \
            --target "$COMMIT" \
            --title "Debug APK (${COMMIT:0:7})" \
            --notes "Debug-signed build of ${COMMIT:0:7}. Replaced on every build of this branch."

  pages:
    name: Publish the menu to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: checks
    # One site, one live version: only a commit on main publishes. A pull
    # request build would otherwise overwrite the menu guests are reading.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # `base_path` is `/<repo>` for a project site and empty for a custom
      # domain, so asking Pages where it will serve from beats hard-coding a
      # path that breaks the day a domain is added.
      - uses: actions/configure-pages@v5
        id: pages

      # Without API_BASE_URL the published menu still renders — it falls back
      # to the catalogue bundled at build time and says so on screen — but the
      # admin console has nothing to connect to, and prices stop tracking D1.
      - name: Build the site
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_API_BASE: ${{ vars.API_BASE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

      - uses: actions/deploy-pages@v4
        id: deployment

  deploy:
    name: Deploy Worker and D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [checks, android]
    # Only a push that lands on main deploys. A pull_request run, however
    # green, never touches the real database or the live Worker.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      # Migrations are idempotent (`CREATE TABLE IF NOT EXISTS`, `ALTER ...
      # ADD COLUMN` swallowing "duplicate column"), so applying the same set
      # twice on an unchanged schema is a no-op rather than a failure.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply zhaoyun-ordering --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy the Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
