name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push to a pull request branch would otherwise run this twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Domain unit tests
        run: npm run unit

      - name: Server integration tests
        run: npm run server:test


      - name: Web build
        run: npm run build

      # The same contract suite the Node server just passed, run against the
      # Worker on a local D1 — workerd and the real D1 engine, so it needs no
      # Cloudflare credentials and runs on every pull request.
      - name: Worker contract on D1
        run: npm run worker:test

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive end-to-end tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  pages:
    name: Publish the menu to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately not `needs: checks`. Publishing a menu is not a release of
    # anything the tests guard — and it still cannot publish something that
    # does not compile, because `npm run build` typechecks first. Gating it on
    # the full suite only meant waiting four minutes to look at a page. The
    # suite still runs, alongside this rather than in front of it.
    #
    # One site, one live version, so normally only a commit on main publishes
    # — a pull request build would otherwise overwrite the menu guests are
    # reading. The second clause is temporary: the menu-only guest app, the
    # combos and the menu styles all live on this branch, so main has nothing
    # worth publishing until it lands. What gets published is the merge
    # commit, which is what main will hold anyway. Delete that clause once it
    # is merged.
    if: >-
      (github.ref == 'refs/heads/main' && github.event_name == 'push')
      || github.head_ref == 'claude/project-review-tm9nvr'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # `base_path` is `/<repo>` for a project site and empty for a custom
      # domain, so asking Pages where it will serve from beats hard-coding a
      # path that breaks the day a domain is added.
      #
      # `enablement` turns Pages on if it is off, using the `pages: write`
      # permission above — without it this step is where a repository that has
      # never had Pages fails, and the fix is a settings page rather than
      # anything in here. It is a no-op once Pages exists.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      # Without API_BASE_URL the published menu still renders — it falls back
      # to the catalogue bundled at build time and says so on screen — but the
      # admin console has nothing to connect to, and prices stop tracking D1.
      - name: Build the site
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_API_BASE: ${{ vars.API_BASE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

      - uses: actions/deploy-pages@v4
        id: deployment

  deploy:
    name: Deploy Worker and D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: checks
    # Only a push that lands on main deploys. A pull_request run, however
    # green, never touches the real database or the live Worker.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run build

      # Migrations are idempotent (`CREATE TABLE IF NOT EXISTS`, `ALTER ...
      # ADD COLUMN` swallowing "duplicate column"), so applying the same set
      # twice on an unchanged schema is a no-op rather than a failure.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply zhaoyun-ordering --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy the Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
