name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push to a pull request branch would otherwise run this twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Domain unit tests
        run: npm run unit

      - name: Server integration tests
        run: npm run server:test


      - name: Web build
        run: npm run build

      # The same contract suite the Node server just passed, run against the
      # Worker on a local D1 — workerd and the real D1 engine, so it needs no
      # Cloudflare credentials and runs on every pull request.
      - name: Worker contract on D1
        run: npm run worker:test

      - name: Production dependency audit
        run: npm audit --omit=dev

  # The browser tests, split three ways across three runners: some four
  # hundred of them, each a real page load, were most of a fifteen-minute
  # run on one. Each shard builds the site itself and serves that build
  # (playwright.config.js), so they start at once instead of after checks.
  e2e:
    name: Browser tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Web build
        run: npm run build

      # The browsers are kept between runs, by Playwright's own version: a
      # download that stalls once cost a whole twenty-minute run.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # WebKit for the iPhone projects: every browser on iOS is WebKit. A
      # stalled download is cut off after four minutes and tried again, up to
      # three times; the lock a cut-off download leaves behind goes first, or
      # the next try stops at once on "another installation in progress".
      - name: Download Playwright Chromium and WebKit
        if: steps.browsers.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            rm -rf ~/.cache/ms-playwright/__dirlock
            if timeout 240 npx playwright install chromium webkit; then exit 0; fi
            echo "::warning::Browser download stalled or failed (attempt $attempt of 3)"
          done
          exit 1

      # The system libraries the browsers need, from apt, whether or not they came from the cache.
      - name: Install the browsers' system libraries
        timeout-minutes: 6
        run: npx playwright install-deps chromium webkit

      - name: Responsive end-to-end tests
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  pages:
    name: Publish the menu to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately not `needs: checks`. Publishing a menu is not a release of
    # anything the tests guard — and it still cannot publish something that
    # does not compile, because `npm run build` typechecks first. Gating it on
    # the full suite only meant waiting four minutes to look at a page. The
    # suite still runs, alongside this rather than in front of it.
    #
    # One site, one live version: only a commit on main publishes. A pull
    # request build would otherwise overwrite the menu guests are reading —
    # and the `github-pages` environment refuses a branch that is not the
    # default one anyway, before a single step of this job can run.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Turning Pages on is the one part of this nobody can automate: creating
      # the site needs admin rights the workflow token is never given, and
      # `configure-pages`' own `enablement` input therefore fails with
      # "Resource not accessible by integration", which says nothing about
      # what to do. Say it here instead, before that happens.
      - name: Check that Pages is switched on
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" = "404" ]; then
            echo "::error::GitHub Pages is off for this repository. Switch it on once, by hand: Settings → Pages → Build and deployment → Source → GitHub Actions. No workflow can do this step."
            exit 1
          fi
          echo "Pages is on (HTTP $status)."

      # `base_path` is `/<repo>` for a project site and empty for a custom
      # domain, so asking Pages where it will serve from beats hard-coding a
      # path that breaks the day a domain is added.
      - uses: actions/configure-pages@v6
        id: pages

      # Without API_BASE_URL the published menu still renders — it falls back
      # to the catalogue bundled at build time and says so on screen — but the
      # admin console has nothing to connect to, and prices stop tracking D1.
      - name: Build the site
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_API_BASE: ${{ vars.API_BASE_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web

      - uses: actions/deploy-pages@v5
        id: deployment

  deploy:
    name: Deploy Worker and D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [checks, e2e]
    # Only a push that lands on main deploys. A pull_request run, however
    # green, never touches the real database or the live Worker.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # A job-level `if` cannot read secrets, so the token comes in as env and
    # the steps below check that instead. Without this the job fails on every
    # push to a repository that has not configured Cloudflare yet, which makes
    # a red tick the normal state and therefore worth ignoring.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Say when there is nothing to deploy to
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN is not set, so D1 and the Worker were left untouched. Add it under Settings → Secrets and variables → Actions → Secrets; docs/D1.md says which two scopes it needs."

      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != ''

      - uses: actions/setup-node@v7
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''

      - run: npm run build
        if: env.CLOUDFLARE_API_TOKEN != ''

      # Migrations are idempotent (`CREATE TABLE IF NOT EXISTS`, `ALTER ...
      # ADD COLUMN` swallowing "duplicate column"), so applying the same set
      # twice on an unchanged schema is a no-op rather than a failure.
      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply zhaoyun-ordering --remote

      # VERSION names the commit, so /api/health says which build is live.
      - name: Deploy the Worker
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy --var VERSION:${GITHUB_SHA} | tee deploy.log

      # A deploy is done when the live Worker answers as the new build: its
      # health check names this commit and reaches D1, and the web app is
      # served with its security headers. Otherwise it is rolled back to the
      # version before, and the run goes red.
      - name: Smoke test the live Worker
        id: smoke
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          base="${API_BASE_URL:-$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)}"
          if [ -z "$base" ]; then
            echo "::error::No address to test: set the API_BASE_URL repository variable to the Worker's address."
            exit 1
          fi
          echo "Testing $base"
          for attempt in $(seq 1 12); do
            health=$(curl -fsS "$base/api/health" || true)
            if echo "$health" | grep -q "\"version\":\"${GITHUB_SHA}\"" && echo "$health" | grep -q '"database":"ok"'; then
              echo "Health: $health"
              break
            fi
            if [ "$attempt" = 12 ]; then
              echo "::error::The live Worker did not answer as this build: $health"
              exit 1
            fi
            sleep 5
          done
          headers=$(curl -fsSIL "$base/admin.html")
          echo "$headers" | grep -qi "^content-security-policy: .*script-src 'self'" || { echo "::error::The web app is served without its Content-Security-Policy"; exit 1; }
          # Saved first: under pipefail, grep -q closing the pipe early would fail curl.
          curl -fsS -o catalog.json "$base/api/catalog"
          grep -q '"products"' catalog.json || { echo "::error::The catalogue does not load"; exit 1; }
          echo "Smoke test passed."

      - name: Roll back a deploy that failed its smoke test
        # Only this deploy's own failure: a migration that failed never deployed anything to undo.
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        run: |
          npx wrangler rollback --message "Smoke test failed for ${GITHUB_SHA}" --yes
          echo "::error::Rolled the Worker back to the version before ${GITHUB_SHA}. D1 migrations are additive and stay applied; see docs/OPERATIONS.md."
