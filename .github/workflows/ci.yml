name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push to a pull request branch would otherwise run this twice, and the
# Android job is the expensive half.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Domain unit tests
        run: npm run unit

      - name: Server integration tests
        run: npm run server:test


      - name: Web build
        run: npm run build

      # The same contract suite the Node server just passed, run against the
      # Worker on a local D1 — workerd and the real D1 engine, so it needs no
      # Cloudflare credentials and runs on every pull request.
      - name: Worker contract on D1
        run: npm run worker:test

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive end-to-end tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    # The APK is the artefact the restaurant actually installs, so it is built
    # from the same commit the checks above ran on.
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Puts the SDK on PATH and accepts the licences the Gradle plugin checks
      # for. `packages` is set because the action still defaults to installing
      # `tools`, which Google removed from the repository — sdkmanager exits 1
      # on "Failed to find package 'tools'" and takes the job with it.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npm run cap:sync

      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      # On a pull_request event GITHUB_SHA is the merge commit, which exists in
      # no branch — name the APK after the commit a person can actually check out.
      - name: Name the APK after the commit
        env:
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p dist/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/apk/zhaoyun-ordering-${COMMIT:0:7}-debug.apk"
          sha256sum dist/apk/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhaoyun-ordering-debug-apk
          path: dist/apk/*.apk
          retention-days: 30
