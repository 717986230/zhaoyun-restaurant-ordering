name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Domain unit tests
        run: npm run unit

      - name: Server integration tests
        run: npm run server:test

      - name: Web build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Responsive end-to-end tests
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    # The APK is the artefact the restaurant actually installs, so it is built
    # from the same commit the checks above ran on.
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships an Android SDK; this puts it on PATH and accepts
      # the licences the Gradle plugin checks for.
      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npm run cap:sync

      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK after the commit
        run: |
          mkdir -p dist/apk
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/apk/zhaoyun-ordering-${GITHUB_SHA::7}-debug.apk"
          sha256sum dist/apk/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhaoyun-ordering-debug-apk
          path: dist/apk/*.apk
          retention-days: 30
