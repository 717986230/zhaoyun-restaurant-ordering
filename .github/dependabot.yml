# Weekly pull requests for outdated dependencies, grouped so a week is one or
# two pull requests rather than twenty. Each runs the full CI like any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Vite, Vitest and the React plugin pin each other's majors: one without
      # the others does not install, so they come as one pull request.
      vite:
        patterns: ["vite", "vitest", "@vitejs/*", "@vitest/*"]
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # A Capacitor major also changes the Android project (Gradle, SDK levels,
      # Java), which CI does not build: it is done by hand with `cap migrate`.
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
